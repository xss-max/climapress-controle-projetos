<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Climapress — Sistema Integrado de Gestão de Obras</title>
    <meta name="description" content="Sistema de Controle Físico-Financeiro, Gestão de Tarefas e Apontamento de Horas - Climapress Instalações" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Barra de Rolagem Horizontal Técnica para o Gantt - Sempre Visível e de Alto Contraste */
      .custom-gantt-scroll {
        overflow-x: scroll !important;
        scrollbar-color: #15365C #E2E8F0;
        scrollbar-width: thin;
      }
      .custom-gantt-scroll::-webkit-scrollbar {
        height: 14px !important;
        width: 14px !important;
        display: block !important;
      }
      .custom-gantt-scroll::-webkit-scrollbar-track {
        background: #F1F5F9 !important;
        border-radius: 8px;
        border: 1px solid #CBD5E1;
      }
      .custom-gantt-scroll::-webkit-scrollbar-thumb {
        background: #15365C !important;
        border-radius: 8px;
        border: 2px solid #F1F5F9;
      }
      .custom-gantt-scroll::-webkit-scrollbar-thumb:hover {
        background: #E52329 !important;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
